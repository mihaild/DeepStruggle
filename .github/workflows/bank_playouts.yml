# Paired playouts for disagreement-bank positions (tools/scripts/bank_playouts.py run), and the
# validation stage of the catastrophic-blunder census (tools/scripts/bank_playouts.py validate,
# positions made by tools/scripts/blunder_census.py screen), split over runners and pooled. The
# positions come from a release asset of this repository, made locally:
#
#   bank_playouts.py select ... --out playout_input.jsonl.gz
#   gh release create bank-input-<date> playout_input.jsonl.gz --prerelease --title "bank playout input"
#   gh workflow run bank_playouts.yml --ref main -f release=bank-input-<date> -f pairs=64 -f runners=20
#   gh run download <run-id> -n bank-playouts-<run-id> -D data/reports/disagreement_bank/playouts
#
# and the census's stage 2 likewise, its release carrying the screening's candidates and control:
#
#   gh release create blunder-input-<date> candidates.jsonl.gz control.jsonl.gz \
#     --prerelease --title "blunder census input"
#   gh workflow run bank_playouts.yml --ref main -f stage=validate \
#     -f release=blunder-input-<date> -f model=_models/E7-A8-R1-S44@6400M+(S44,45,46)@6720..6800M.pt \
#     -f pairs=64 -f runners=20
#   gh run download <run-id> -n bank-playouts-<run-id> -D data/reports/blunder_census/validation
#
# and the blunder bank's confirmation (tools/scripts/blunder_bank.py confirm), once per judge, on a
# shortlist made by `blunder_bank.py select` from the census's validation:
#
#   gh release create blunder-shortlist-<date> shortlist.jsonl.gz --prerelease --title "blunder bank shortlist"
#   gh workflow run bank_playouts.yml --ref main -f stage=confirm -f release=blunder-shortlist-<date> \
#     -f model=_models/E7-A8-R1-S44@6400M+(S44,45,46)@6720..6800M.pt -f pairs=512 -f runners=20
#
# and its exact check (tools/scripts/blunder_bank.py prove), which needs no model and no pairs,
# on the bank itself (a plain .jsonl asset is fine):
#
#   gh release create blunder-bank-<date> ai/eval/banks/blunders_E7.jsonl --prerelease --title "blunder bank"
#
#   gh workflow run bank_playouts.yml --ref main -f stage=prove -f release=blunder-bank-<date> \
#     -f runners=20 -f args="--budget 2000000"
name: bank-playouts

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "run (the disagreement bank), validate (blunder census), confirm or prove (blunder bank, tools/scripts/blunder_bank.py)"
        default: "run"
      release:
        description: "Release whose asset(s) *.jsonl or *.jsonl.gz hold the positions (the committed bank is plain)"
        required: true
      model:
        description: "Model in the Hugging Face repo: the .onnx that plays the playouts (stage run), or the .pt whose search validates the positions (stage validate)"
        default: "E7line_swa_4720-4800M.onnx"
      pairs:
        description: "Pairs per position"
        default: "64"
      runners:
        description: "Runners"
        default: "20"
      args:
        description: "Further arguments for the stage (e.g. --search-sims 256 --continue-with 256:8)"
        default: ""
      hf_repo:
        description: "Hugging Face repo"
        default: "mihaild/deepstruggle"

permissions:
  contents: read

env:
  PYTHONPATH: .:build/release
  RELEASE: ${{ inputs.release }}
  STAGE: ${{ inputs.stage || 'run' }}
  MODEL: ${{ inputs.model || 'E7line_swa_4720-4800M.onnx' }}
  PAIRS: ${{ inputs.pairs || '64' }}
  RUNNERS: ${{ inputs.runners || '20' }}
  ARGS: ${{ inputs.args || '' }}
  HF_REPO: ${{ inputs.hf_repo || 'mihaild/deepstruggle' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.p.outputs.parts }}
    steps:
      - id: p
        run: echo "parts=$(python3 -c "import json,os; print(json.dumps(list(range(1, int(os.environ['RUNNERS']) + 1))))")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJson(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Fetch the positions and the model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" --pattern '*.jsonl' --pattern '*.jsonl.gz' --dir input
          [ "$STAGE" = prove ] && exit 0
          mkdir -p data/checkpoints/hf
          curl -sSfL --retry 3 -o "data/checkpoints/hf/$(basename "$MODEL")" "https://huggingface.co/$HF_REPO/resolve/main/$MODEL"
      - name: ${{ env.STAGE }} (part ${{ matrix.part }})
        run: |
          mkdir -p out
          tool=bank_playouts.py
          weights="data/checkpoints/hf/$(basename "$MODEL")"
          case "$STAGE" in
            run) model_flag=(--onnx "$weights" --pairs "$PAIRS") ;;
            validate) model_flag=(--model "$weights" --pairs "$PAIRS") ;;
            confirm) tool=blunder_bank.py; model_flag=(--model "$weights" --pairs "$PAIRS") ;;
            prove) tool=blunder_bank.py; model_flag=() ;;
            *) echo "unknown stage: $STAGE" >&2; exit 1 ;;
          esac
          [ "$STAGE" = prove ] || sha256sum "$weights"
          python "tools/scripts/$tool" "$STAGE" --input input/*.jsonl* \
            "${model_flag[@]}" \
            --part "${{ matrix.part }}/$RUNNERS" --out "out/playouts-${{ matrix.part }}.jsonl.gz" $ARGS
      - uses: actions/upload-artifact@v7
        with:
          name: bank-playouts-part-${{ github.run_id }}-${{ matrix.part }}
          path: out/
          retention-days: 14

  # Pools whatever parts arrived, so one failed runner does not discard the others' hours; the
  # missing parts are named in report/playouts.jsonl.gz.parts.json and in provenance.txt.
  pool:
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: bank-playouts-part-${{ github.run_id }}-*
          path: parts
          merge-multiple: true
      - name: Pool
        run: |
          mkdir -p report
          python tools/scripts/bank_playouts.py pool --parts parts/playouts-*.jsonl.gz --expect "$RUNNERS" \
            --out report/playouts.jsonl.gz
          {
            echo "commit: $GITHUB_SHA"
            echo "stage: $STAGE  args: $ARGS"
            echo "positions: release $RELEASE"
            echo "model: $HF_REPO $MODEL  pairs: $PAIRS  runners: $RUNNERS"
            echo "parts: $(cat report/playouts.jsonl.gz.parts.json)"
          } > report/provenance.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bank-playouts-${{ github.run_id }}
          path: report/
          retention-days: 90
