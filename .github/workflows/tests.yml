# The engine's C++ suite and the backend Python suite (everything but tests/web, which has its
# own workflow because it needs Emscripten and a browser). Measured on a 4-worker run: C++ under a
# second, bindings + engine_logic + docs ~20 s, training ~3 min -- so training is its own job and
# the groups run side by side.
#
# Nothing that needs the ts-replayer corpus runs on GitHub: not tests/replayer, and not the tests
# elsewhere that read the corpus or the human dataset built from it (CORPUS_TESTS). Run those
# locally (CLAUDE.md, "The ts-replayer corpus"). They are excluded by name rather than left to
# skip or fail, so a green run never counts them as checked.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The subprocess tests (e.g. test_import_survives_older_engine) do not inherit pytest.ini's
  # `pythonpath`, so build/release must be on PYTHONPATH itself.
  PYTHONPATH: .:build/release
  # Tests outside tests/replayer that read the corpus, or the human dataset built from it. A
  # renamed test drops out of the deselection and then skips or fails, so keep this list in step
  # with the files.
  CORPUS_TESTS: >-
    tests/engine_logic/test_headline_resolution_order.py
    tests/engine_logic/test_china_card_space_race.py::test_replay_247_converts_end_to_end
    tests/engine_logic/test_cuban_missile_crisis_choice.py::test_replay_264_converts_end_to_end
    tests/engine_logic/test_norad_action_round_scope.py::test_replay_296_gets_past_its_bear_trap_escape
    tests/training/test_setup_arms.py::test_the_setup_only_injector_keeps_setup_rows_and_the_policy_term

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: C++ unit tests
        run: ./build/release/engine/ts_tests
      - name: Invariant fuzzing
        run: ./build/release/engine/ts_fuzz --games 10000

  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: core
            paths: tests/bindings tests/engine_logic tests/docs tests/lint
          - name: training
            paths: tests/training
    name: python (${{ matrix.group.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: pytest
        run: |
          deselect=()
          for t in $CORPUS_TESTS; do deselect+=("--deselect=$t"); done
          python -m pytest -q -n auto ${{ matrix.group.paths }} "${deselect[@]}"
