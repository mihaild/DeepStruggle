# The browser workbench on GitHub Pages: the engine compiled to WebAssembly and the page, built
# from main and published as static files. Nothing runs server-side -- models come from Hugging
# Face or a file dropped on the page, replays from a file.
#
# The leaderboard's Playdek scale is fitted from the stats database in a job of its own: the
# Cloudflare token reaches that one step, and only aggregates leave it (the logins are private).
# Without the secrets, or if the fit fails, the page is published without that scale.
#
# Enable once in the repository: Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  playdek:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.fit.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # which default a bare `rollout` meant depends on the build's ancestry

      # The fit re-drives each game it counts, as tools/game_stats.py rating does.
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/stats_worker/package-lock.json

      # Before the token is in any environment, and running no package's install scripts.
      - name: Install wrangler
        working-directory: web/stats_worker
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fit the players on Playdek's scale
        id: fit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONPATH: .:build/release
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::warning::no Cloudflare secrets: the page will have no Playdek scale (web/stats_worker/README.md)"
          elif python tools/playdek_estimate.py --output playdek-estimate/playdek.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the Playdek fit failed: the page will have no Playdek scale"
          fi

      - uses: actions/upload-artifact@v7
        if: steps.fit.outputs.ready == 'true'
        with:
          name: playdek-estimate
          path: playdek-estimate/playdek.json
          retention-days: 1

  build:
    needs: playdek
    # A failed fit job must not stop the page: it is then published without the Playdek scale.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      EMSDK_VERSION: "6.0.10"   # pinned, as tools/scripts/install_emsdk.sh is
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Cache Emscripten
        uses: actions/cache@v6
        with:
          path: ~/.local/opt/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        run: tools/scripts/install_emsdk.sh

      # Say which stats endpoint the page gets: an unset repository variable (or one set on the
      # github-pages environment, which this job does not use) builds a page that cannot submit.
      - name: Stats endpoint
        env:
          TS_STATS_ENDPOINT: ${{ vars.TS_STATS_ENDPOINT }}
        run: |
          if [[ -n "$TS_STATS_ENDPOINT" ]]; then
            echo "::notice::stats endpoint: $TS_STATS_ENDPOINT"
          else
            echo "::warning::vars.TS_STATS_ENDPOINT is empty: the page will offer the download only (web/stats_worker/README.md)"
          fi

      - uses: actions/download-artifact@v8
        if: needs.playdek.outputs.ready == 'true'
        with:
          name: playdek-estimate
          path: playdek-estimate

      - name: Build the engine (WebAssembly) and the page
        env:
          # The page is served under /<repository>/ on Pages.
          TS_WEB_BASE: /${{ github.event.repository.name }}/
          TS_PYTHON: python3
          # The stats database's Worker (web/stats_worker/README.md); unset, games are not submitted.
          TS_STATS_ENDPOINT: ${{ vars.TS_STATS_ENDPOINT }}
          # tools/playdek_estimate.py's output; unset, the leaderboard has no Playdek scale.
          TS_PLAYDEK_ESTIMATE: ${{ needs.playdek.outputs.ready == 'true' && format('{0}/playdek-estimate/playdek.json', github.workspace) || '' }}
        run: tools/scripts/build_web.sh

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/ui/dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
