[pytest]
# build/release is where the documented configure step puts ts_engine
# (LIBRARY_OUTPUT_DIRECTORY = CMAKE_BINARY_DIR, and AGENTS.md configures -B build/release).
#
# This used to read "build .", which resolved only because a stale ts_engine.so had been
# left directly in build/ by an older `cmake -B build` configuration. pytest picked that
# up ahead of any PYTHONPATH, so the whole suite silently ran against a months-old engine
# -- the eighth-Action-Round fix looked broken in the main checkout while passing in a
# worktree, because worktrees had no such stray file. Point at the real build directory so
# there is one obvious place for the extension to come from.
pythonpath = build/release .
# The differential suites (tests/differential/) are not run by default and are not part of the
# check a change is expected to pass. They are WIP and not informative in their current state, so
# do not spend time getting them to pass. Gating lives in tests/conftest.py, which skips anything
# marked differential_fuzz unless you ask for it by --run-fuzz, -m differential_fuzz, or by naming
# the file -- deliberately a skip rather than an --ignore here, so those escape hatches keep working.

markers =
    differential_fuzz: Fuzzing tests against external reference engines (Struggler, ts-blockchain)
